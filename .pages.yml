content:
  - name: site
    label: Store Settings
    type: file
    path: data/site.json
    format: json
    operations:
      delete: false
    fields:
      - { name: storeName, label: Store name, type: string, required: true }
      - { name: logoLetter, label: Logo letter, type: string }
      - { name: location, label: Location, type: string }
      - { name: announcement, label: Top announcement bar, type: string }
      - { name: heroEyebrow, label: Hero small heading, type: string }
      - { name: heroLine1, label: Hero headline — line 1, type: string }
      - { name: heroLine2, label: Hero headline — line 2, type: string }
      - { name: heroDescription, label: Hero description, type: text }
      - { name: instagramUrl, label: Instagram URL, type: string }
      - { name: whatsappUrl, label: WhatsApp URL, type: string }
      - { name: email, label: Contact email, type: string }
      - { name: primaryButtonText, label: Shop button text, type: string }
      - { name: contactButtonText, label: Contact button text, type: string }
      - { name: trustItem1, label: Trust item 1, type: string }
      - { name: trustItem2, label: Trust item 2, type: string }
      - { name: trustItem3, label: Trust item 3, type: string }
      - { name: inventoryTitle, label: Inventory heading, type: string }
      - { name: inventoryDescription, label: Inventory description, type: text }
      - { name: whyTitle, label: Why Kelvo heading, type: string }
      - { name: whyDescription, label: Why Kelvo description, type: text }
      - { name: ctaEyebrow, label: Bottom CTA small heading, type: string }
      - { name: ctaTitle, label: Bottom CTA heading, type: string }
      - { name: footerText, label: Footer text, type: string }
      - { name: accentColor, label: Accent color, type: string }
      - { name: backgroundColor, label: Background color, type: string }
